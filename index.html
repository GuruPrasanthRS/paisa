<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Paisa — Expense Tracker</title>
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Paisa" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <!-- SYNC STATUS BAR -->
  <div class="sync-bar" id="sync-bar">
    <span id="sync-msg">Connecting…</span>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="log" onclick="switchTab('log')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      <span>Log</span>
    </button>
    <button class="nav-btn" data-tab="today" onclick="switchTab('today')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Today</span>
    </button>
    <button class="nav-btn" data-tab="dashboard" onclick="switchTab('dashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <span>Insights</span>
    </button>
    <button class="nav-btn" data-tab="history" onclick="switchTab('history')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>History</span>
    </button>
  </nav>

  <!-- LOG TAB -->
  <div class="tab-content active" id="tab-log">
    <div class="screen-wrap">
      <header class="screen-header header-with-btn">
        <div>
          <div class="header-greeting" id="greeting">Good morning</div>
          <div class="header-date" id="header-date"></div>
        </div>
        <button class="settings-btn" id="open-settings-btn" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </header>

      <div class="quick-stats">
        <div class="qs-card"><span class="qs-label">Today</span><span class="qs-val" id="qs-today">₹0</span></div>
        <div class="qs-divider"></div>
        <div class="qs-card"><span class="qs-label">This month</span><span class="qs-val" id="qs-month">₹0</span></div>
        <div class="qs-divider"></div>
        <div class="qs-card"><span class="qs-label">UPI today</span><span class="qs-val upi" id="qs-upi">₹0</span></div>
        <div class="qs-divider"></div>
        <div class="qs-card"><span class="qs-label">Cash today</span><span class="qs-val cash" id="qs-cash">₹0</span></div>
      </div>

      <div class="form-card">
        <div class="mode-toggle">
          <button class="mode-btn active upi-active" id="mode-upi" onclick="setMode('upi')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
            UPI
          </button>
          <button class="mode-btn" id="mode-cash" onclick="setMode('cash')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="20" height="12" rx="1"/><circle cx="12" cy="12" r="3"/></svg>
            Cash
          </button>
        </div>

        <div class="amount-field">
          <span class="rupee-sym">₹</span>
          <input type="number" id="f-amt" placeholder="0" inputmode="decimal" autocomplete="off" />
        </div>

        <div class="field-row">
          <div class="field-group">
            <label for="f-desc">Spent on</label>
            <input type="text" id="f-desc" placeholder="Tea, auto, lunch…" autocomplete="off" />
          </div>
          <div class="field-group narrow">
            <label for="f-time">Time</label>
            <input type="time" id="f-time" />
          </div>
        </div>

        <div class="field-row">
          <div class="field-group">
            <label for="f-cat">Category</label>
            <select id="f-cat">
              <option value="Food & Drink">🍛 Food & Drink</option>
              <option value="Transport">🚗 Transport</option>
              <option value="Shopping">🛍 Shopping</option>
              <option value="Health">💊 Health</option>
              <option value="Entertainment">🎬 Entertainment</option>
              <option value="Bills & Recharge">📱 Bills & Recharge</option>
              <option value="Groceries">🛒 Groceries</option>
              <option value="Other">📦 Other</option>
            </select>
          </div>
        </div>

        <div class="field-group" style="margin-bottom:16px">
          <label for="f-note">Note <span class="optional">(optional)</span></label>
          <input type="text" id="f-note" placeholder="Any extra detail…" autocomplete="off" />
        </div>

        <button class="save-btn" id="save-btn" onclick="addExpense()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
          Save expense
        </button>
      </div>

      <div class="section-title">Recent today</div>
      <div id="recent-list"></div>
    </div>
  </div>

  <!-- TODAY TAB -->
  <div class="tab-content" id="tab-today">
    <div class="screen-wrap">
      <header class="screen-header">
        <div class="header-greeting">Daily log</div>
        <div class="date-nav">
          <button class="datenav-btn" onclick="changeDay(-1)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <span class="date-nav-label" id="today-label"></span>
          <button class="datenav-btn" onclick="changeDay(1)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </header>
      <div class="day-summary">
        <div class="ds-total">
          <span class="ds-label">Total</span>
          <span class="ds-amount" id="ds-total">₹0</span>
        </div>
        <div class="ds-split">
          <div class="ds-pill upi"><span>UPI</span><span id="ds-upi">₹0</span></div>
          <div class="ds-pill cash"><span>Cash</span><span id="ds-cash">₹0</span></div>
        </div>
      </div>
      <div id="today-entries"></div>
    </div>
  </div>

  <!-- DASHBOARD TAB -->
  <div class="tab-content" id="tab-dashboard">
    <div class="screen-wrap">
      <header class="screen-header">
        <div class="header-greeting">Insights</div>
        <div class="month-select-wrap">
          <select id="dash-month" onchange="renderDashboard()"></select>
        </div>
      </header>
      <div class="dash-grid">
        <div class="dash-card span2">
          <div>
            <div class="dash-card-label">Monthly total</div>
            <div class="dash-card-val" id="d-monthly">₹0</div>
            <div class="dash-card-sub" id="d-daily-avg"></div>
          </div>
        </div>
        <div class="dash-card"><div class="dash-card-label">UPI</div><div class="dash-card-val upi" id="d-upi">₹0</div></div>
        <div class="dash-card"><div class="dash-card-label">Cash</div><div class="dash-card-val cash" id="d-cash">₹0</div></div>
      </div>
      <div class="chart-section">
        <div class="section-title">Daily spending</div>
        <div class="bar-chart-wrap"><canvas id="bar-chart" height="160"></canvas></div>
      </div>
      <div class="chart-section">
        <div class="section-title">By category</div>
        <div id="cat-breakdown"></div>
      </div>
      <div class="chart-section">
        <div class="section-title">UPI vs Cash</div>
        <div class="donut-wrap">
          <canvas id="donut-chart" width="160" height="160"></canvas>
          <div class="donut-legend" id="donut-legend"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- HISTORY TAB -->
  <div class="tab-content" id="tab-history">
    <div class="screen-wrap">
      <header class="screen-header">
        <div class="header-greeting">History</div>
        <div class="search-wrap">
          <input type="text" id="hist-search" placeholder="Search expenses…" oninput="renderHistory()" />
        </div>
      </header>
      <div class="filter-row">
        <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
        <button class="filter-btn" onclick="setFilter('upi',this)">UPI</button>
        <button class="filter-btn" onclick="setFilter('cash',this)">Cash</button>
        <button class="filter-btn" onclick="setFilter('Food & Drink',this)">Food</button>
        <button class="filter-btn" onclick="setFilter('Transport',this)">Transport</button>
        <button class="filter-btn" onclick="setFilter('Shopping',this)">Shopping</button>
      </div>
      <div id="history-list"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- PASSCODE LOCK SCREEN OVERLAY -->
  <div class="lock-overlay" id="lock-overlay" style="display: none;">
    <div class="lock-container">
      <div class="lock-header">
        <div class="lock-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <h2 class="lock-title">Enter Passcode</h2>
        <p class="lock-subtitle">Paisa is locked</p>
      </div>
      <div class="pin-dots" id="pin-dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <div class="lock-keypad">
        <button class="key-btn" data-key="1">1</button>
        <button class="key-btn" data-key="2">2</button>
        <button class="key-btn" data-key="3">3</button>
        <button class="key-btn" data-key="4">4</button>
        <button class="key-btn" data-key="5">5</button>
        <button class="key-btn" data-key="6">6</button>
        <button class="key-btn" data-key="7">7</button>
        <button class="key-btn" data-key="8">8</button>
        <button class="key-btn" data-key="9">9</button>
        <button class="key-btn text-btn" data-key="clear">Clear</button>
        <button class="key-btn" data-key="0">0</button>
        <button class="key-btn text-btn" data-key="delete">⌫</button>
      </div>
    </div>
  </div>

  <!-- SETTINGS MODAL -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Settings</h3>
        <button class="close-modal-btn" id="close-settings-btn" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="setting-item">
          <div class="setting-info">
            <span class="setting-name">Passcode Security</span>
            <span class="setting-desc">Secure this app on your device</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="passcode-toggle" />
            <span class="slider"></span>
          </label>
        </div>
        <div class="passcode-setup-fields hidden" id="passcode-setup-fields">
          <label for="new-pin-input">Set new 4-digit PIN</label>
          <div class="pin-setup-container">
            <input type="password" id="new-pin-input" maxlength="4" placeholder="••••" inputmode="numeric" autocomplete="off" />
            <button class="primary-btn" id="save-pin-btn">Enable PIN</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
